
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wamotek Character Converter</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #f4f6f8;
        color: #20252b;

        font-family:
            "Noto Sans",
            "Noto Sans CJK",
            "Noto Sans Symbols 2",
            "Segoe UI",
            "Arial Unicode MS",
            Arial,
            sans-serif;
    }

    header {
        background: #17324d;
        color: white;
        padding: 24px 32px;
    }

    header h1 {
        margin: 0;
        font-size: 25px;
        font-weight: 700;
    }

    header p {
        margin: 6px 0 0;
        opacity: 0.82;
        font-size: 14px;
    }

    main {
        max-width: 1200px;
        margin: 32px auto;
        padding: 0 20px;
    }

    .converter {
        display: grid;
        grid-template-columns: 1fr 70px 1fr;
        gap: 18px;
        align-items: stretch;
    }

    .panel {
        position: relative;

        background: white;
        border: 1px solid #dce1e6;
        border-radius: 14px;
        overflow: hidden;

        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    }

    .panel-title {
        padding: 13px 16px;

        background: #f8f9fa;
        border-bottom: 1px solid #e3e6e9;

        font-size: 14px;
        font-weight: 700;
    }

    textarea,
    .output,
    .locked-input {
        width: 100%;
        min-height: 360px;

        padding: 20px;
        border: 0;
        outline: none;

        font-family:
            "Noto Sans",
            "Noto Sans CJK",
            "Noto Sans Symbols 2",
            "Segoe UI",
            "Arial Unicode MS",
            Arial,
            sans-serif;

        font-size: 20px;
        line-height: 1.7;

        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    textarea {
        display: block;
        resize: vertical;
    }

    .output {
        background: #ffffff;
        cursor: default;
    }

    .locked-input {
        display: none;
        background: #ffffff;
        cursor: default;
        overflow: auto;
    }

    .arrow {
        display: flex;
        align-items: center;
        justify-content: center;

        color: #17324d;
        font-size: 32px;
        font-weight: bold;
    }


    /* ========================================================
       SPELLING WARNING
       ======================================================== */

    .warning {
        color: #d00000;
        font-weight: 700;
    }


    /* ========================================================
       WORD CLASS MARKING
       ======================================================== */

    .word {
        position: relative;
        display: inline;
        border-radius: 4px;
    }

    /*
       Hover is ONLY enabled inside the locked Input area.
       Output never receives hover highlighting.
    */

    .locked-input .word {
        cursor: pointer;
    }

    .locked-input .word:hover {
        background: #eef3f7;
    }

    .word.noun {
        background: #ffd9d9;
    }

    .word.verb {
        background: #d9f3df;
    }

    .word.adjective {
        background: #fff1b8;
    }

    .word-label {
        display: inline-block;

        margin-left: 4px;
        padding: 1px 5px;

        border-radius: 4px;

        background: #17324d;
        color: white;

        font-family:
            "Noto Sans",
            "Noto Sans CJK",
            "Segoe UI",
            Arial,
            sans-serif;

        font-size: 11px;
        line-height: 1.4;
        font-weight: 700;

        vertical-align: middle;
    }


    /* ========================================================
       WORD CLASS MENU
       ======================================================== */

    .word-menu {
        position: fixed;
        z-index: 1000;

        display: none;

        min-width: 160px;
        padding: 6px;

        background: white;
        border: 1px solid #d7dde2;
        border-radius: 10px;

        box-shadow:
            0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .word-menu.visible {
        display: block;
    }

    .menu-title {
        padding: 7px 9px 6px;

        color: #68737d;
        font-size: 11px;
        font-weight: 700;
    }

    .menu-button {
        display: block;

        width: 100%;
        padding: 8px 10px;

        border: 0;
        border-radius: 7px;

        background: transparent;
        color: #20252b;

        text-align: left;
        font-size: 14px;
        font-weight: 600;

        cursor: pointer;
    }

    .menu-button:hover {
        background: #eef3f7;
    }

    .menu-button.remove {
        margin-top: 4px;

        border-top: 1px solid #e5e8eb;
        border-radius: 0 0 7px 7px;

        color: #a00000;
    }


    /* ========================================================
       CONTROLS
       ======================================================== */

    .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;

        margin-top: 20px;
    }

    button.main-button {
        padding: 10px 16px;

        border: 0;
        border-radius: 9px;

        background: #17324d;
        color: white;

        cursor: pointer;

        font-size: 14px;
        font-weight: 600;
    }

    button.main-button:hover {
        background: #234967;
    }

    button.secondary {
        padding: 10px 16px;

        border: 0;
        border-radius: 9px;

        background: #e8edf1;
        color: #26323c;

        cursor: pointer;

        font-size: 14px;
        font-weight: 600;
    }

    button.secondary:hover {
        background: #dce3e8;
    }


    /* ========================================================
       STATUS
       ======================================================== */

    .status {
        margin-top: 16px;
        padding: 13px 16px;

        background: white;
        border: 1px solid #dce1e6;
        border-radius: 10px;

        font-size: 14px;
    }

    .status.warning-status {
        color: #b00000;
        background: #fff5f5;
        border-color: #f0cccc;
    }

    .legend {
        margin-top: 12px;

        color: #68737d;
        font-size: 13px;
    }

    .legend .red {
        color: #d00000;
        font-weight: 700;
    }

    .legend .blue {
        color: #17324d;
        font-weight: 700;
    }


    @media (max-width: 800px) {

        .converter {
            grid-template-columns: 1fr;
        }

        .arrow {
            height: 40px;
            transform: rotate(90deg);
        }
    }

</style>

</head>

<body>

<header>
    <h1>Wamotek Character Converter</h1>
    <p>
        Character-by-character conversion with spelling and word-class marking
    </p>
</header>

<main>

<div class="converter">

    <div class="panel">

        <div class="panel-title">
            Input
        </div>

        <textarea
            id="input"
            placeholder="Type or paste text here..."
        ></textarea>

        <div
            id="lockedInput"
            class="locked-input"
        ></div>

    </div>


    <div class="arrow">
        →
    </div>


    <div class="panel">

        <div class="panel-title">
            Converted Output
        </div>

        <div
            id="output"
            class="output"
        ></div>

    </div>

</div>


<div class="controls">

    <button
        id="lockButton"
        class="main-button"
        onclick="toggleLock()"
    >
        Lock
    </button>

    <button
        class="secondary"
        onclick="clearAll()"
    >
        Clear
    </button>

    <button
        class="secondary"
        onclick="clearWordClasses()"
    >
        Clear Word Classes
    </button>

</div>


<div
    id="status"
    class="status"
>
    No spelling changes detected.
</div>


<div class="legend">

    <span class="red">
        Red and bold
    </span>
    = spelling may require manual modification.

    &nbsp;&nbsp;
</div>

</main>


<div
    id="wordMenu"
    class="word-menu"
>

<div class="menu-title">
    Select word class
</div>

<button
    class="menu-button"
    onclick="setWordClass('n.')"
>
    n. Noun
</button>

<button
    class="menu-button"
    onclick="setWordClass('v.')"
>
    v. Verb
</button>

<button
    class="menu-button"
    onclick="setWordClass('de.')"
>
    de. Descriptive
</button>

<button
    class="menu-button"
    onclick="setWordClass('n/a')"
>
    n/a Not applicable
</button>

<button
    class="menu-button remove"
    onclick="removeWordClass()"
>
    Remove marking
</button>

</div>


<script>

/* ============================================================
   CHARACTER CONVERSION TABLE
   ============================================================ */

const mapping = {

    "A": "I",
    "a": "i",

    "E": "U",
    "e": "u",

    "I": "A",
    "i": "a",

    "O": "Ü",
    "o": "ü",

    "U": "O",
    "u": "o",

    "Y": "E",
    "y": "e",

    "B": "S",
    "b": "s",

    "C": "L",
    "c": "l",

    "D": "C",
    "d": "c",

    "F": "G",
    "f": "g",

    "G": "M",
    "g": "m",

    "H": "Ö",
    "h": "ö",

    "J": "J",
    "j": "j",

    "K": "Ë",
    "k": "ë",

    "L": "Z",
    "l": "z",

    "M": "H",
    "m": "h",

    "N": "T",
    "n": "t",

    "P": "P",
    "p": "p",

    "Q": "V",
    "q": "v",

    "R": "B",
    "r": "b",

    "S": "R",
    "s": "r",

    "T": "K",
    "t": "k",

    "V": "X",
    "v": "x",

    "W": "N",
    "w": "n",

    "X": "F",
    "x": "f",

    "Z": "D",
    "z": "d"
};


/* ============================================================
   CHARACTER CATEGORIES
   ============================================================ */

/*
   Only dotted E, O and U are vowels for spelling rules:

       Ë ë
       Ö ö
       Ü ü

   Plain E, O and U are NOT treated as vowels by
   the spelling-warning system.
*/

const vowels = new Set([
    "Ë",
    "ë",
    "Ö",
    "ö",
    "Ü",
    "ü"
]);


const consonants = new Set([
    "b", "c", "d", "f", "g", "h", "j", "k",
    "l", "m", "n", "p", "q", "r", "s", "t",
    "v", "w", "x", "z",

    "B", "C", "D", "F", "G", "H", "J", "K",
    "L", "M", "N", "P", "Q", "R", "S", "T",
    "V", "W", "X", "Z"
]);


const clusterTriggers = new Set([
    "c", "r", "s", "x", "z",
    "C", "R", "S", "X", "Z"
]);


const letters =
    /^[A-Za-zÄËÏÖÜäëïöü]$/;


/* ============================================================
   LOCK STATE
   ============================================================ */

let isLocked = false;

let wordClasses = {};

let selectedWordIndex = null;


/* ============================================================
   CHARACTER CONVERSION
   ============================================================ */

function convertCharacter(char) {

    return mapping[char] ?? char;
}


function convertString(text) {

    let converted = "";

    for (const char of text) {

        converted +=
            convertCharacter(char);
    }

    return converted;
}


/* ============================================================
   SPELLING WARNING DETECTION
   ============================================================ */

function findWarnings(text) {

    const warnings = [];


    function addWarning(start, end) {

        if (end > start) {

            warnings.push({
                start,
                end
            });
        }
    }


    /* ========================================================
       RULE 1
       Consonant cluster containing c/r/s/x/z
       ======================================================== */

    let i = 0;


    while (i < text.length) {

        if (!consonants.has(text[i])) {

            i++;
            continue;
        }


        const start = i;


        while (
            i < text.length &&
            consonants.has(text[i])
        ) {

            i++;
        }


        const end = i;


        if (end - start >= 2) {

            let containsTrigger = false;


            for (
                let j = start;
                j < end;
                j++
            ) {

                if (
                    clusterTriggers.has(
                        text[j]
                    )
                ) {

                    containsTrigger = true;
                    break;
                }
            }


            if (containsTrigger) {

                addWarning(
                    start,
                    end
                );
            }
        }
    }


    /* ========================================================
       RULE 2
       Three or more dotted vowels

       No spelling warning.
       ======================================================== */


    /* ========================================================
       RULE 3
       Three or more consecutive consonants
       ======================================================== */

    i = 0;


    while (i < text.length) {

        if (!consonants.has(text[i])) {

            i++;
            continue;
        }


        const start = i;


        while (
            i < text.length &&
            consonants.has(text[i])
        ) {

            i++;
        }


        const end = i;


        if (end - start >= 3) {

            addWarning(
                start,
                end
            );
        }
    }

    /* ========================================================
       RULE 4
       Repeated consecutive letters
       ======================================================== */

    i = 0;


    while (
        i < text.length - 1
    ) {

        const current =
            text[i];

        const next =
            text[i + 1];


        if (
            letters.test(current) &&
            letters.test(next) &&
            current.toLowerCase() ===
            next.toLowerCase()
        ) {

            addWarning(
                i,
                i + 2
            );
        }


        i++;
    }


    /* ========================================================
       RULE 5
       Dotted vowel + h

       Only h is highlighted.
       ======================================================== */

    for (
        i = 0;
        i < text.length - 1;
        i++
    ) {

        if (
            vowels.has(text[i]) &&
            text[i + 1].toLowerCase() === "h"
        ) {

            addWarning(
                i + 1,
                i + 2
            );
        }
    }


    /* ========================================================
       RULE 6
       Dotted vowel + l

       No spelling warning.
       ======================================================== */


    /* ========================================================
       MERGE OVERLAPPING WARNINGS
       ======================================================== */

    warnings.sort(
        (a, b) =>
            a.start - b.start
    );


    const merged = [];


    for (
        const warning of warnings
    ) {

        if (
            merged.length === 0
        ) {

            merged.push({
                start: warning.start,
                end: warning.end
            });

            continue;
        }


        const last =
            merged[
                merged.length - 1
            ];


        if (
            warning.start <=
            last.end
        ) {

            last.end =
                Math.max(
                    last.end,
                    warning.end
                );

        } else {

            merged.push({
                start: warning.start,
                end: warning.end
            });
        }
    }


    return merged;
}


/* ============================================================
   HTML ESCAPING
   ============================================================ */

function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* ============================================================
   WORD TOKENIZATION
   ============================================================ */

function isWordCharacter(char) {

    return letters.test(char);
}


function tokenizeText(text) {

    const tokens = [];

    let i = 0;


    while (
        i < text.length
    ) {

        const start = i;


        if (
            isWordCharacter(
                text[i]
            )
        ) {

            while (
                i < text.length &&
                isWordCharacter(
                    text[i]
                )
            ) {

                i++;
            }


            tokens.push({
                type: "word",
                text: text.slice(
                    start,
                    i
                )
            });


        } else {

            while (
                i < text.length &&
                !isWordCharacter(
                    text[i]
                )
            ) {

                i++;
            }


            tokens.push({
                type: "text",
                text: text.slice(
                    start,
                    i
                )
            });
        }
    }


    return tokens;
}


/* ============================================================
   WORD CLASS CSS
   ============================================================ */

function getWordClassCSS(
    wordClass
) {

    switch (wordClass) {

        case "n.":
            return "noun";

        case "v.":
            return "verb";

        case "de.":
            return "adjective";

        default:
            return "";
    }
}


/* ============================================================
   RENDER LOCKED INPUT
   ============================================================ */

function renderLockedInput() {

    const input =
        document.getElementById(
            "input"
        );


    const lockedInput =
        document.getElementById(
            "lockedInput"
        );


    const text =
        input.value;


    const tokens =
        tokenizeText(text);


    let html = "";

    let wordIndex = 0;


    for (
        const token of tokens
    ) {

        if (
            token.type === "text"
        ) {

            html +=
                escapeHTML(
                    token.text
                );

            continue;
        }


        const wordClass =
            wordClasses[
                wordIndex
            ] ?? null;


        const cssClass =
            getWordClassCSS(
                wordClass
            );


        html +=
            '<span' +
            ' class="word ' +
            cssClass +
            '"' +
            ' data-word-index="' +
            wordIndex +
            '"' +
            ' onclick="openWordMenu(event, ' +
            wordIndex +
            ')"' +
            '>' +

            escapeHTML(
                token.text
            ) +

            (
                wordClass
                    ? '<span class="word-label">' +
                      escapeHTML(
                          wordClass
                      ) +
                      '</span>'
                    : ''
            ) +

            '</span>';


        wordIndex++;
    }


    lockedInput.innerHTML =
        html;
}


/* ============================================================
   RENDER OUTPUT
   ============================================================ */

function renderOutput(text) {

    const output =
        document.getElementById(
            "output"
        );


    const status =
        document.getElementById(
            "status"
        );


    const warnings =
        findWarnings(text);


    const tokens =
        tokenizeText(text);


    let globalPosition = 0;

    let wordIndex = 0;

    let html = "";


    for (
        const token of tokens
    ) {

        if (
            token.type === "text"
        ) {

            html +=
                escapeHTML(
                    token.text
                );


            globalPosition +=
                token.text.length;


            continue;
        }


        const wordStart =
            globalPosition;


        const wordEnd =
            wordStart +
            token.text.length;


        const wordClass =
            wordClasses[
                wordIndex
            ] ?? null;


        const cssClass =
            getWordClassCSS(
                wordClass
            );


        const wordWarnings =
            warnings.filter(
                warning =>
                    warning.end >
                    wordStart &&
                    warning.start <
                    wordEnd
            );


        let wordHTML = "";

        let localPosition = 0;


        for (
            const warning of
            wordWarnings
        ) {

            const warningStart =
                Math.max(
                    warning.start -
                    wordStart,
                    0
                );


            const warningEnd =
                Math.min(
                    warning.end -
                    wordStart,
                    token.text.length
                );


            if (
                warningStart >
                localPosition
            ) {

                wordHTML +=
                    escapeHTML(
                        token.text.slice(
                            localPosition,
                            warningStart
                        )
                    );
            }


            wordHTML +=
                '<span class="warning">' +
                escapeHTML(
                    token.text.slice(
                        warningStart,
                        warningEnd
                    )
                ) +
                '</span>';


            localPosition =
                warningEnd;
        }


        if (
            localPosition <
            token.text.length
        ) {

            wordHTML +=
                escapeHTML(
                    token.text.slice(
                        localPosition
                    )
                );
        }


        html +=
            '<span class="word ' +
            cssClass +
            '">' +

            wordHTML +

            (
                wordClass
                    ? '<span class="word-label">' +
                      escapeHTML(
                          wordClass
                      ) +
                      '</span>'
                    : ''
            ) +

            '</span>';


        globalPosition =
            wordEnd;


        wordIndex++;
    }


    output.innerHTML =
        html;


    if (
        warnings.length === 0
    ) {

        status.textContent =
            "No spelling changes detected.";

        status.classList.remove(
            "warning-status"
        );

    } else {

        status.textContent =
            warnings.length +
            " spelling section(s) may require manual modification.";

        status.classList.add(
            "warning-status"
        );
    }
}


/* ============================================================
   LOCK / UNLOCK
   ============================================================ */

function toggleLock() {

    const input =
        document.getElementById(
            "input"
        );


    const lockedInput =
        document.getElementById(
            "lockedInput"
        );


    const button =
        document.getElementById(
            "lockButton"
        );


    if (!isLocked) {

        isLocked = true;


        renderLockedInput();


        input.style.display =
            "none";


        lockedInput.style.display =
            "block";


        button.textContent =
            "Unlock";


        /*
           Lock and Unlock deliberately use
           the exact same button color.
        */

        button.classList.remove(
            "locked"
        );

    } else {

        isLocked = false;


        input.style.display =
            "block";


        lockedInput.style.display =
            "none";


        button.textContent =
            "Lock";


        button.classList.remove(
            "locked"
        );


        input.focus();
    }
}


/* ============================================================
   OPEN WORD MENU
   ============================================================ */

function openWordMenu(
    event,
    wordIndex
) {

    if (!isLocked) {
        return;
    }


    event.stopPropagation();


    selectedWordIndex =
        Number(wordIndex);


    const menu =
        document.getElementById(
            "wordMenu"
        );


    menu.classList.add(
        "visible"
    );


    const rect =
        event.currentTarget
        .getBoundingClientRect();


    let left =
        rect.left;


    let top =
        rect.bottom + 7;


    const menuWidth =
        160;


    const menuHeight =
        225;


    if (
        left + menuWidth >
        window.innerWidth - 10
    ) {

        left =
            window.innerWidth -
            menuWidth -
            10;
    }


    if (
        top + menuHeight >
        window.innerHeight - 10
    ) {

        top =
            rect.top -
            menuHeight -
            7;
    }


    menu.style.left =
        Math.max(
            left,
            10
        ) + "px";


    menu.style.top =
        Math.max(
            top,
            10
        ) + "px";
}


/* ============================================================
   SET WORD CLASS
   ============================================================ */

function setWordClass(
    wordClass
) {

    if (
        selectedWordIndex === null
    ) {
        return;
    }


    if (
        wordClass === "n/a"
    ) {

        delete wordClasses[
            selectedWordIndex
        ];

    } else {

        wordClasses[
            selectedWordIndex
        ] = wordClass;
    }


    closeWordMenu();


    renderLockedInput();


    const input =
        document.getElementById(
            "input"
        );


    renderOutput(
        convertString(
            input.value
        )
    );
}


/* ============================================================
   REMOVE WORD CLASS
   ============================================================ */

function removeWordClass() {

    if (
        selectedWordIndex === null
    ) {
        return;
    }


    delete wordClasses[
        selectedWordIndex
    ];


    closeWordMenu();


    renderLockedInput();


    const input =
        document.getElementById(
            "input"
        );


    renderOutput(
        convertString(
            input.value
        )
    );
}


/* ============================================================
   CLOSE WORD MENU
   ============================================================ */

function closeWordMenu() {

    const menu =
        document.getElementById(
            "wordMenu"
        );


    menu.classList.remove(
        "visible"
    );


    selectedWordIndex =
        null;
}


/* ============================================================
   CLEAR EVERYTHING
   ============================================================ */

function clearAll() {

    document.getElementById(
        "input"
    ).value = "";


    document.getElementById(
        "output"
    ).textContent = "";


    document.getElementById(
        "lockedInput"
    ).textContent = "";


    wordClasses = {};


    closeWordMenu();


    if (isLocked) {

        isLocked = false;


        document.getElementById(
            "input"
        ).style.display =
            "block";


        document.getElementById(
            "lockedInput"
        ).style.display =
            "none";
    }


    const button =
        document.getElementById(
            "lockButton"
        );


    button.textContent =
        "Lock";


    button.classList.remove(
        "locked"
    );


    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        "No spelling changes detected.";


    status.classList.remove(
        "warning-status"
    );
}


/* ============================================================
   CLEAR WORD CLASSES
   ============================================================ */

function clearWordClasses() {

    wordClasses = {};


    closeWordMenu();


    if (isLocked) {

        renderLockedInput();
    }


    const input =
        document.getElementById(
            "input"
        );


    renderOutput(
        convertString(
            input.value
        )
    );
}


/* ============================================================
   CLOSE MENU WHEN CLICKING ELSEWHERE
   ============================================================ */

document.addEventListener(
    "click",
    function(event) {

        const menu =
            document.getElementById(
                "wordMenu"
            );


        if (
            menu.classList.contains(
                "visible"
            ) &&
            !menu.contains(
                event.target
            ) &&
            !event.target.closest(
                ".locked-input .word"
            )
        ) {

            closeWordMenu();
        }
    }
);


/* ============================================================
   LIVE OUTPUT WHILE EDITING
   ============================================================ */

document
    .getElementById("input")
    .addEventListener(
        "input",
        function() {

            if (!isLocked) {

                const converted =
                    convertString(
                        this.value
                    );

                renderOutput(
                    converted
                );
            }
        }
    );


/* ============================================================
   INITIALIZE
   ============================================================ */

convertText();

</script>
